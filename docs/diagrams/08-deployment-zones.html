    <h1>Deployment &amp; network zones: agent, monitor, operator</h1>

      <desc id="08-deployment-zones-desc">Trust-boundary architecture in which an untrusted agent process reaches tools only by crossing a single mediated loopback path into the trusted monitor process, which evaluates policy, queues human approvals, runs tool mocks, holds sequence state, and writes an append-only audit log that the operator console reads while sending approve or deny decisions.</desc>
