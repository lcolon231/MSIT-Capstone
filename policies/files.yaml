# Files mock domain (issue #16, T4.4). Reads are allowed; deleting a file is irreversible and
# routes to a human (D5 file-delete gate class). No matching rule -> fail-closed DENY.

rules:
  - rule_id: files.list_files.allow
    tool: list_files
    trigger: action
    enforce: allow

  - rule_id: files.read_file.allow
    tool: read_file
    trigger: action
    enforce: allow

  - rule_id: files.delete_file.gate
    tool: delete_file
    trigger: action
    enforce: gate
