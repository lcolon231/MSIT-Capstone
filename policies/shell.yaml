# Argument-aware shell policy (issue #8 / T2.5, criterion #3).
#
# First-match ordering: destructive commands are denied BEFORE the general allow, so
# shell("ls") is ALLOWed while shell("rm -rf /") — and its encoded variants — are DENYed.
# The is_destructive_cmd predicate canonicalizes ${IFS}, quote/backslash splitting, case,
# unicode homoglyphs, and base64-pipe-to-shell before matching.

rules:
  - rule_id: shell.destructive.deny
    tool: shell
    trigger: action
    enforce: deny
    checks:
      - predicate: is_destructive_cmd
        params: { arg: command }

  # Shape-locked allow: only a call whose ONLY argument is a string `command` can match.
  # Anything else (extra keys, a list/dict/number command, no command at all) falls through to
  # the fail-closed default DENY — the allow never relies on the deny rule above catching it.
  - rule_id: shell.allow
    tool: shell
    trigger: action
    enforce: allow
    checks:
      - predicate: args_allowlist
        params: { allowed: [command] }
      - predicate: arg_matches
        params: { arg: command, pattern: '.*' }
