# Credentials mock domain (issue #16, T4.4). Listing secret names is allowed; retrieving a
# secret routes to a human (D5 credential-access gate class). The value is never returned.

rules:
  - rule_id: credentials.list_credentials.allow
    tool: list_credentials
    trigger: action
    enforce: allow

  - rule_id: credentials.access_credential.gate
    tool: access_credential
    trigger: action
    enforce: gate
