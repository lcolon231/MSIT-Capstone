[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-containment-monitor"
version = "0.1.0"
description = "Fail-closed runtime containment monitor for LLM-agent tool calls (CIS 6950 capstone)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0.3",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

# `src` is itself the top-level import package (tests do `from src.monitor import ...`),
# so this is a src-as-package layout, not the conventional src/ layout.
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "integration: end-to-end through real components (sockets, subprocesses, Flask + monitor); deselect with -m 'not integration'",
    "real_fsync: do not stub the audit writer's fsync for this test",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Conservative, high-signal set: pyflakes + import sorting + syntax/runtime errors.
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
